[package]
name = "volsurf"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["env", "derive"] }
crossbeam = "0.8.5"
eyre = "0.6.14"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
